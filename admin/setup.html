<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiết Lập Quản Trị Viên - TRÂU TƯƠI HIỀN BÉO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .setup-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .required {
            color: #e74c3c;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 14px;
            color: #555;
        }

        .password-strength {
            margin-top: 5px;
            font-size: 12px;
            color: #666;
        }

        @media (max-width: 600px) {
            .setup-container {
                padding: 30px 20px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="logo">
            <h1>🐃 TRÂU TƯƠI HIỀN BÉO</h1>
            <p>Hệ thống quản trị nhà hàng</p>
        </div>

        <h2>THIẾT LẬP QUẢN TRỊ VIÊN</h2>

        <div class="info-box">
            ℹ️ Đây là tài khoản quản trị viên đầu tiên. Tài khoản này sẽ có quyền SUPER_ADMIN với toàn quyền quản lý hệ thống.
        </div>

        <div id="alertBox"></div>

        <form id="setupForm">
            <div class="form-group">
                <label>Họ và tên <span class="required">*</span></label>
                <input type="text" id="name" required placeholder="Nguyễn Văn A">
            </div>

            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="email" required placeholder="admin@example.com">
            </div>

            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" id="phone" placeholder="0123456789">
            </div>

            <div class="form-group">
                <label>Mật khẩu <span class="required">*</span></label>
                <input type="password" id="password" required placeholder="Tối thiểu 6 ký tự">
                <div class="password-strength" id="passwordStrength"></div>
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu <span class="required">*</span></label>
                <input type="password" id="confirmPassword" required placeholder="Nhập lại mật khẩu">
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                TẠO QUẢN TRỊ VIÊN
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('setupForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const passwordInput = document.getElementById('password');
        const passwordStrength = document.getElementById('passwordStrength');

        // Check if setup is needed
        async function checkSetup() {
            try {
                const response = await fetch('/api/auth/check-setup');
                const data = await response.json();

                if (!data.needsSetup) {
                    showAlert('Hệ thống đã được thiết lập. Đang chuyển hướng...', 'success');
                    setTimeout(() => {
                        window.location.href = '/admin/login.html';
                    }, 2000);
                }
            } catch (error) {
                console.error('Check setup error:', error);
            }
        }

        // Password strength indicator
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            let strength = '';
            let color = '';

            if (password.length === 0) {
                strength = '';
            } else if (password.length < 6) {
                strength = '❌ Quá ngắn';
                color = '#e74c3c';
            } else if (password.length < 8) {
                strength = '⚠️ Yếu';
                color = '#f39c12';
            } else if (password.length < 12) {
                strength = '✓ Trung bình';
                color = '#3498db';
            } else {
                strength = '✓✓ Mạnh';
                color = '#27ae60';
            }

            passwordStrength.textContent = strength;
            passwordStrength.style.color = color;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            if (!name || !email || !password) {
                showAlert('Vui lòng điền đầy đủ thông tin bắt buộc', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Mật khẩu xác nhận không khớp', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Mật khẩu phải có ít nhất 6 ký tự', 'error');
                return;
            }

            // Submit
            submitBtn.disabled = true;
            submitBtn.textContent = 'ĐANG TẠO...';

            try {
                const response = await fetch('/api/auth/setup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password, confirmPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Tạo quản trị viên thành công! Đang chuyển hướng...', 'success');
                    setTimeout(() => {
                        window.location.href = '/admin/login.html';
                    }, 2000);
                } else {
                    showAlert(data.error || 'Đã xảy ra lỗi. Vui lòng thử lại', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'TẠO QUẢN TRỊ VIÊN';
                }
            } catch (error) {
                console.error('Setup error:', error);
                showAlert('Không thể kết nối đến máy chủ', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'TẠO QUẢN TRỊ VIÊN';
            }
        });

        function showAlert(message, type) {
            alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                if (type === 'error') {
                    alertBox.innerHTML = '';
                }
            }, 5000);
        }

        // Check setup on load
        checkSetup();
    </script>
</body>
</html>
