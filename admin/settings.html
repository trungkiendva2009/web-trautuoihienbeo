<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài Đặt - Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>

    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">🐃</div>
                <div class="sidebar-title">TRÂU TƯƠI HIỀN BÉO</div>
                <div class="sidebar-subtitle">Quản trị nhà hàng</div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><span class="nav-item-icon">📊</span><span>Tổng quan</span></a>
                <a href="menu.html" class="nav-item"><span class="nav-item-icon">🍽️</span><span>Món ăn</span></a>
                <a href="categories.html" class="nav-item"><span class="nav-item-icon">📂</span><span>Danh mục</span></a>
                <a href="orders.html" class="nav-item"><span class="nav-item-icon">🛒</span><span>Đơn hàng</span></a>
                <a href="reservations.html" class="nav-item"><span class="nav-item-icon">📅</span><span>Đặt bàn</span></a>
                <a href="gallery.html" class="nav-item"><span class="nav-item-icon">🖼️</span><span>Hình ảnh</span></a>
                <a href="settings.html" class="nav-item active"><span class="nav-item-icon">⚙️</span><span>Cài đặt</span></a>
                <a href="accounts.html" class="nav-item"><span class="nav-item-icon">👥</span><span>Tài khoản</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">A</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Admin</div>
                        <div class="user-role" id="userRole">Quản trị viên</div>
                    </div>
                </div>
                <button class="btn btn-secondary" style="width: 100%;" onclick="AdminAuth.logout()">🚪 Đăng xuất</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">Cài Đặt Nhà Hàng</h1>
                <p class="page-subtitle">Quản lý thông tin nhà hàng (chỉ SUPER_ADMIN)</p>
            </div>

            <div id="alertBox"></div>

            <div class="card">
                <h2 class="card-title">Thông Tin Nhà Hàng</h2>
                <form id="settingsForm" style="max-width: 600px;">
                    <div class="form-group">
                        <label class="form-label">Tên nhà hàng <span style="color: red;">*</span></label>
                        <input type="text" id="restaurantName" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Địa chỉ <span style="color: red;">*</span></label>
                        <textarea id="restaurantAddress" class="form-textarea" required style="min-height: 80px;"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Số điện thoại <span style="color: red;">*</span></label>
                        <input type="tel" id="restaurantPhone" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Giờ mở cửa <span style="color: red;">*</span></label>
                        <input type="text" id="restaurantHours" class="form-input" required placeholder="VD: 06:00 – 02:00">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mô tả</label>
                        <textarea id="restaurantDescription" class="form-textarea"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">💾 Lưu thay đổi</button>
                </form>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
    <script>
        let currentAdmin = null;

        async function init() {
            currentAdmin = await initializeUserDisplay();
            if (currentAdmin) {
                if (currentAdmin.role !== 'SUPER_ADMIN') {
                    document.querySelector('.main-content').innerHTML = `
                        <div class="page-header">
                            <h1 class="page-title">Cài Đặt</h1>
                        </div>
                        <div class="card">
                            <div class="alert alert-error">
                                ❌ Bạn không có quyền truy cập trang này. Chỉ SUPER_ADMIN mới có thể quản lý cài đặt.
                            </div>
                        </div>
                    `;
                    return;
                }
                await loadSettings();
                setupEventListeners();
            }
        }

        function setupEventListeners() {
            document.getElementById('settingsForm').addEventListener('submit', saveSettings);
        }

        async function loadSettings() {
            try {
                const response = await fetch('/api/settings');
                const data = await response.json();

                if (data.settings) {
                    document.getElementById('restaurantName').value = data.settings.restaurant_name || '';
                    document.getElementById('restaurantAddress').value = data.settings.address || '';
                    document.getElementById('restaurantPhone').value = data.settings.phone || '';
                    document.getElementById('restaurantHours').value = data.settings.opening_hours || '';
                    document.getElementById('restaurantDescription').value = data.settings.description || '';
                }
            } catch (error) {
                console.error('Load settings error:', error);
                AdminUI.showAlert('Không thể tải cài đặt', 'error');
            }
        }

        async function saveSettings(e) {
            e.preventDefault();

            const restaurant_name = document.getElementById('restaurantName').value.trim();
            const address = document.getElementById('restaurantAddress').value.trim();
            const phone = document.getElementById('restaurantPhone').value.trim();
            const opening_hours = document.getElementById('restaurantHours').value.trim();
            const description = document.getElementById('restaurantDescription').value.trim();

            if (!restaurant_name || !address || !phone || !opening_hours) {
                AdminUI.showAlert('Vui lòng điền đầy đủ thông tin bắt buộc', 'error');
                return;
            }

            try {
                const response = await fetch('/api/settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        restaurant_name,
                        address,
                        phone,
                        opening_hours,
                        description
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    AdminUI.showAlert(data.message, 'success');
                } else {
                    AdminUI.showAlert(data.error || 'Đã xảy ra lỗi', 'error');
                }
            } catch (error) {
                console.error('Save settings error:', error);
                AdminUI.showAlert('Không thể kết nối đến máy chủ', 'error');
            }
        }

        init();
    </script>
</body>
</html>
